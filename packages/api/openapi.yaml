          in: query
          description: Free-text search over title and counterparty.
          schema: { type: string }
          example: acme
      responses:
        "200":
          description: Paginated list of contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contract"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Contracts]
      summary: Upload a new contract
      operationId: createContract
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, counterparty]
              properties:
                file:
                  type: string
                  format: binary
                  description: Contract source file. Allowed types are PDF, DOC, DOCX, and TXT.
                title:
                  type: string
                  maxLength: 500
                  example: Master Services Agreement - Acme Corp
                counterparty:
                  type: string
                  maxLength: 500
                  example: Acme Corp
                tags:
                  oneOf:
                    - type: string
                      description: JSON array string or comma-separated list.
                      example: '["msa","vendor"]'
                    - type: array
                      items:
                        type: string
                  description: Optional tags. Maximum 20 tags, 50 characters each.
                expirationDate:
                  type: string
                  format: date
                  nullable: true
                  example: "2027-12-31"
                legalState:
                  type: string
                  enum: [DRAFT, ACTIVE, EXPIRED, TERMINATED]
                  example: ACTIVE
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Contract"
        "401":
          description: Unauthorized
          content:
            application/json:
