        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Updated organization settings, including the new logo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions or inactive organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing file, unsupported file type, or invalid file contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The logo could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Settings]
      summary: Remove the organization's logo
      operationId: deleteOrganizationLogo
      description: >
        Deletes the organization's current logo. Requires OWNER or ADMIN.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Updated organization settings, with logoUrl now null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettingsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions or inactive organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization has no logo to delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The logo could not be deleted from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags: [Users]
      summary: List users in the current organization
      operationId: listUsers
      description: >
        Available to any authenticated member of the organization — viewing
        the roster is not admin-only, only the mutating endpoints below are.
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/role:
    put:
      tags: [Users]
      summary: Change a user's role
      operationId: updateUserRole
      description: >
        Requires the `OWNER` or `ADMIN` role. `OWNER` cannot be assigned
        through this endpoint, cannot be changed itself, and callers cannot
        change their own role.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error, or an OWNER-related rule was violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /users/{id}/status:
    put:
      tags: [Users]
      summary: Suspend or reactivate a user (soft-disable)
      operationId: updateUserStatus
      description: >
        Requires the `OWNER` or `ADMIN` role. This is the disable/enable
        flow — users are never hard-deleted. Callers cannot change their own
        status, and the organization `OWNER`'s status cannot be changed here.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error, or an OWNER/self-target rule was violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /invitations:
    post:
      tags: [Users]
      summary: Invite a new user
      operationId: createInvitation
      description: >
        Requires the `OWNER` or `ADMIN` role. Creates a pending Invitation
        and emails an accept-invitation link; no User row is created until
        the invitation is accepted (see `POST /auth/accept-invitation`).
        `role` cannot be `OWNER`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invitation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A user or pending invitation already exists for this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    get:
      tags: [Users]
      summary: List pending and expired invitations for the current organization
      operationId: listInvitations
      description: >
        Returns invitations with status `PENDING` or `EXPIRED` — actionable
        ones an admin can still resend. `ACCEPTED` invitations become Users
        (see `GET /users`) and `REVOKED` ones are terminal, so neither is
        included. Available to any authenticated member of the organization,
        matching `GET /users`. Creating, resending, or revoking invitations
        is admin-only.
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated list of pending and expired invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{id}/resend:
    post:
      tags: [Users]
      summary: Resend a pending invitation
      operationId: resendInvitation
      description: >
        Requires the `OWNER` or `ADMIN` role. Issues a new token and
        expiry, invalidating the previous one, and re-sends the invitation
        email. Also revives an `EXPIRED` invitation back to `PENDING`.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 7c8b9a2e-4d3f-4e5a-8b6c-7d8e9f0a1b2c
      responses:
        "200":
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invitation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation already accepted or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{id}/revoke:
    post:
      tags: [Users]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      description: >
        Requires the `OWNER` or `ADMIN` role. Only a `PENDING` invitation can
        be revoked; a revoked invitation can never be accepted.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 7c8b9a2e-4d3f-4e5a-8b6c-7d8e9f0a1b2c
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invitation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Only a pending invitation can be revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/witness-link:
    get:
      tags: [Users]
      summary: List witness access links for the organization
      operationId: listWitnessLinks
      description: >
        Requires the `OWNER` or `ADMIN` role — witness link management is an
        Admin/Owner responsibility, same as GET /contracts/{id}/audit.
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: contractId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated list of witness links
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WitnessLinkListItem"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Users]
      summary: Generate a witness access link for a contract
      operationId: createWitnessLink
      description: >
        Creates a single-use witness token and returns the raw token once.
        The token is delivered to `witnessEmail` and redeemed via
        `POST /auth/witness/{token}`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WitnessLinkBody"
      responses:
        "201":
          description: Witness link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WitnessToken"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /users/witness-link/stats:
    get:
      tags: [Users]
      summary: Real aggregate counts for the organization's witness links
      operationId: getWitnessLinkStats
      description: >
        Requires the `OWNER` or `ADMIN` role, same as the rest of witness
        link management. Backs the Witness Workflow page's KPI cards and
        review-progress funnel.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The organization's witness link stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WitnessLinkStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/witness-link/{id}/revoke:
    post:
      tags: [Users]
      summary: Revoke a witness access link
      operationId: revokeWitnessLink
      description: >
        Requires the `OWNER` or `ADMIN` role. Guards on `isRevoked` rather
        than `status`, so a `USED` link remains revocable, not just an
        `ISSUED` one — a witness may still be mid-session, and revocation
        must cut that off immediately (checked on every request by
        witnessSessionMiddleware, not just at redemption). Only an
        already-revoked link is rejected.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 4b3a2c1d-6e5f-4a3b-9c8d-7e6f5a4b3c2d
      responses:
        "200":
          description: Witness link revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WitnessToken"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Witness invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This witness invitation has already been revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /witness/contract:
    get:
      tags: [Users]
      summary: Get the single contract scoped to the current witness session
      operationId: getWitnessScopedContract
      description: >
        Read-only view for an external witness (BR-8) — there is no
        contract id in the path; the one allowed contract always comes from
        the witness session, never from a client-supplied value. Gated by
        witnessSessionMiddleware rather than authenticate/authorize, since a
        witness has no User account (BR-4).
      security:
        - witnessSessionAuth: []
      responses:
        "200":
          description: The witness's scoped contract view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WitnessScopedContract"
        "401":
          description: Missing, invalid, expired, or revoked witness session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /witness/contract/file:
    get:
      tags: [Users]
      summary: Download the source file of the contract scoped to the current witness session
      operationId: getWitnessScopedContractFile
      description: >
        Streams the file's bytes through the API rather than redirecting to a
        presigned S3 URL — MinIO has no public hostname, so a presigned URL
        handed straight to the browser would fail to resolve. Same session
        scoping as GET /witness/contract: no contract id in the path.
      security:
        - witnessSessionAuth: []
      responses:
        "200":
          description: Binary file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Missing, invalid, expired, or revoked witness session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
