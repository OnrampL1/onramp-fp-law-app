openapi: 3.1.0

info:
  title: Starter Kit API
  version: 1.0.0
  description: REST API for the Starter Kit application

servers:
  - url: /api
    description: Default server

tags:
  - name: Auth
    description: Authentication and session management
  - name: Contracts
    description: Contract upload, metadata, notes, and audit history
  - name: AI
    description: AI-generated contract summaries, risk analysis, and chat
  - name: Users
    description: User and witness-link management
  - name: Audit
    description: Organization-wide audit trail (Owner/Admin oversight only)
  - name: Settings
    description: Organization settings and preferences
  - name: Organization Brain
    description: Organization-owned templates, policies, clauses, and guidelines
  - name: Platform Auth
    description: Platform-user authentication and session management
  - name: Platform Organizations
    description: Platform-level organization provisioning and lifecycle management
  - name: Legal Knowledge Base
    description: >
      Read-only, globally-shared Lebanese legal reference corpus (Phase 6).
      Not organization-scoped — every authenticated user queries the same
      underlying content.

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login
    platformCookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: >
        HttpOnly access token cookie for PlatformUser sessions. Platform users
        are separate from organization Users and are authorized by
        PlatformUserRole, not organization UserRole.
    witnessSessionAuth:
      type: apiKey
      in: cookie
      name: witnessAccessToken
      description: >
        HttpOnly witness session cookie set by POST /auth/witness/{token}.
        Carries only the witnessInvitationId; every request is re-validated
        against the invitation's isRevoked/expiresAt in the database, so
        revocation takes effect immediately, not just on next token refresh.

  parameters:
    ContractId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ContractIdParam:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    OrganizationId:
      name: id
      in: path
      required: true
      description: >
        Must match the authenticated user's organization — the org is
        derived from the session, this path segment is only checked against
        it, never trusted on its own.
      schema:
        type: string
        format: uuid
      example: 8b6b3f2e-1c1a-4a2b-9c3d-0f6a2e8b7a10

  schemas:
    AcceptInvitationBody:
      type: object
      required: [invitationToken, fullName, password]
      properties:
        invitationToken:
          type: string
          description: Raw invitation token from the invite email link
          example: 3f1e9c2b7a8d4f6e9c0b1a2d3e4f5061
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    PlatformUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        email:
          type: string
          format: email
          example: platform.admin@example.com
        fullName:
          type: string
          example: Platform Admin
        role:
          type: string
          enum: [SUPER_ADMIN, SUPPORT_ENGINEER]
          example: SUPER_ADMIN

    PlatformLoginBody:
      allOf:
        - $ref: "#/components/schemas/LoginBody"

    PlatformOrganizationOwner:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, INTERNAL]
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DEACTIVATED]

    PlatformOrganizationCounts:
      type: object
      properties:
        members:
          type: integer
          example: 3
        invitations:
          type: integer
          example: 0
        contracts:
          type: integer
          example: 8
        auditLogs:
          type: integer
          example: 12

    PlatformOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Legal Ops
        slug:
          type: string
          example: acme-legal-ops
        status:
          type: string
          enum: [CREATED, OWNER_ASSIGNED, ACTIVE, SUSPENDED, ARCHIVED]
          example: ACTIVE
        ownerAssignedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/PlatformOrganizationOwner"
        counts:
          $ref: "#/components/schemas/PlatformOrganizationCounts"

    CreatePlatformOrganizationBody:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Acme Legal Ops
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          example: acme-legal-ops
        timezone:
          type: string
          default: UTC
          example: UTC
        language:
          type: string
          default: en
          example: en

    AssignPlatformOrganizationOwnerBody:
      type: object
      required: [email, fullName, password]
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Owner User
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1

    UpdatePlatformOrganizationStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
          example: SUSPENDED

    CreateNoteBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          example: Confirmed the termination clause with the counterparty's counsel.
        parentNoteId:
          type: string
          format: uuid
          nullable: true
          description: Set to reply to an existing note.
          example: null

    AIChatBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          example: What happens if we terminate early?

    UpdateUserRoleBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: OWNER is not assignable through this endpoint.
          enum: [ADMIN, INTERNAL]
          example: INTERNAL

    WitnessLinkBody:
      type: object
      required: [contractId, witnessEmail]
      properties:
        contractId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        witnessEmail:
          type: string
          format: email
          example: witness@example.com
        witnessName:
          type: string
          nullable: true
          example: Jordan Smith
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
          example: 72
        sendEmail:
          type: boolean
          default: true
          description: >
            Whether to email the witness the link (reuses the same
            Resend/BullMQ pattern as user invitations). If false, the raw
            link is still returned in the response for the admin to share
            directly.

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        organizationId:
          type: string
          format: uuid
          example: 8b6b3f2e-1c1a-4a2b-9c3d-0f6a2e8b7a10
        email:
          type: string
          format: email
          example: user@example.com
        fullName:
          type: string
          example: Jane Doe
        role:
          type: string
          description: >
            OWNER and ADMIN both have full User Management access; INTERNAL
            is read-only. OWNER cannot be assigned via the role-change
            endpoint — it is only ever set through organization ownership
            assignment/transfer.
          enum: [OWNER, ADMIN, INTERNAL]
          example: ADMIN
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DEACTIVATED]
          example: ACTIVE
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-01T00:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7c8b9a2e-4d3f-4e5a-8b6c-7d8e9f0a1b2c
        email:
          type: string
          format: email
          example: new.hire@acmelegal.com
        role:
          type: string
          enum: [ADMIN, INTERNAL]
          example: INTERNAL
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
          example: PENDING
        expiresAt:
          type: string
          format: date-time
          example: "2024-01-08T00:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    CreateInvitationBody:
      type: object
      required: [email, fullName, role]
      properties:
        email:
          type: string
          format: email
          example: new.hire@acmelegal.com
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Jordan Lee
        role:
          type: string
          enum: [ADMIN, INTERNAL]
          example: INTERNAL

    UpdateUserStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          example: SUSPENDED

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Invalid email address

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    SuccessResponse:
      type: object
      description: Generic acknowledgement envelope for actions with no meaningful payload (e.g. deletes).
      properties:
        data:
          type: object
          properties:
            success:
              type: boolean
              example: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 87
        totalPages:
          type: integer
          example: 5

    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        contractUpdates:
          type: boolean
          example: true
        riskAlerts:
          type: boolean
          example: true
        aiInsights:
          type: boolean
          example: false

    OrganizationSettingsData:
      type: object
      properties:
        organization:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 00000000-0000-4000-8000-000000000001
            name:
              type: string
              example: Ridgeline & Voss LLP
            slug:
              type: string
              example: ridgeline-voss
            status:
              type: string
              enum: [CREATED, OWNER_ASSIGNED, ACTIVE, SUSPENDED, ARCHIVED]
              example: ACTIVE
        settings:
          type: object
          properties:
            timezone:
              type: string
              example: Asia/Beirut
            language:
              type: string
              enum: [en, fr, ar]
              example: en
            logoUrl:
              type: string
              format: uri
              nullable: true
              description: >-
                A short-lived presigned download URL for the organization's
                logo, resolved fresh on every read. Null when no logo has
                been uploaded. Upload or remove the logo via the dedicated
                /settings/organization/logo endpoints, not this field.
              example: https://storage.example.com/organization-logos/...
            logoUrlExpiresInSeconds:
              type: integer
              nullable: true
              description: How long logoUrl remains valid for, in seconds. Null when logoUrl is null.
              example: 900
            notificationPreferences:
              nullable: true
              oneOf:
                - $ref: "#/components/schemas/NotificationPreferences"
                - type: "null"
            branding:
              nullable: true
              description: Reserved organization branding JSON. Not currently edited by the settings UI.
        permissions:
          type: object
          properties:
            canManageSettings:
              type: boolean
              example: true
            canRenameOrganization:
              type: boolean
              example: true

    OrganizationSettingsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OrganizationSettingsData"

    UpdateOrganizationSettingsBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Ridgeline & Voss LLP
        timezone:
          type: string
          description: Must be a valid IANA timezone.
          example: Asia/Beirut
        language:
          type: string
          enum: [en, fr, ar]
          example: en
        notificationPreferences:
          $ref: "#/components/schemas/NotificationPreferences"

    # ─── Contract Management System ────────────────────────────────────────────
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8b6b3f2e-1c1a-4a2b-9c3d-0f6a2e8b7a10
        name:
          type: string
          example: Acme Legal LLP
        domain:
          type: string
          nullable: true
          example: acmelegal.com
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    ContractMetadata:
      type: object
      description: Editable metadata fields for a contract.
      required: [title, counterparty, contractType]
      properties:
        title:
          type: string
          example: Master Services Agreement - Acme Corp
        counterparty:
          type: string
          example: Acme Corp
        contractType:
          type: string
          example: msa
        status:
          type: string
          enum: [draft, active, expired, terminated]
          example: active
        effectiveDate:
          type: string
          format: date
          nullable: true
          example: "2024-02-01"
        expirationDate:
          type: string
          format: date
          nullable: true
          example: "2025-02-01"
        tags:
          type: array
          items:
            type: string
          example: [vendor, saas]

    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractMetadata"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            organizationId:
              type: string
              format: uuid
              example: 8b6b3f2e-1c1a-4a2b-9c3d-0f6a2e8b7a10
            uploadedBy:
              $ref: "#/components/schemas/User"
            fileName:
              type: string
              nullable: true
              example: msa-acme-corp.pdf
            fileSize:
              type: integer
              nullable: true
              description: File size in bytes
              example: 245678
            createdAt:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00.000Z"
            updatedAt:
              type: string
              format: date-time
              example: "2024-01-15T10:30:00.000Z"

    ContractNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6c9a2b1e-4f3d-4e5a-8b6c-7d8e9f0a1b2c
        contractId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        author:
          $ref: "#/components/schemas/User"
        parentNoteId:
          type: string
          format: uuid
          nullable: true
          example: null
        body:
          type: string
          example: Confirmed the termination clause with the counterparty's counsel.
        createdAt:
          type: string
          format: date-time
          example: "2024-01-16T09:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-16T09:00:00.000Z"

    OrganizationBrainItemType:
      type: string
      enum: [TEMPLATE, POLICY, CLAUSE, GUIDELINE]
      example: TEMPLATE

    OrganizationBrainItemSource:
      type: string
      enum: [UPLOAD, PASTE]
      example: UPLOAD

    OrganizationBrainItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 5b5d1d9c-6d6b-4a2f-b95f-1bda0e5c88b8
        title:
          type: string
          example: Preferred SaaS MSA
        type:
          $ref: "#/components/schemas/OrganizationBrainItemType"
        source:
          $ref: "#/components/schemas/OrganizationBrainItemSource"
        fileName:
          type: string
          nullable: true
          example: Preferred-SaaS-MSA.pdf
        mimeType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          example: 245760
        createdByName:
          type: string
          example: Jane Doe
        createdAt:
          type: string
          format: date-time
          example: "2026-08-09T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-09T10:00:00.000Z"

    OrganizationBrainItemDetail:
      allOf:
        - $ref: "#/components/schemas/OrganizationBrainItem"
        - type: object
          properties:
            downloadUrl:
              type: string
              format: uri
              description: Short-lived presigned download URL.
              example: https://storage.example.com/signed-url
            downloadUrlExpiresInSeconds:
              type: integer
              example: 900

    OrganizationBrainListResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationBrainItem"
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            pageSize:
              type: integer
              example: 20
            total:
              type: integer
              example: 42
            totalPages:
              type: integer
              example: 3

    CreateOrganizationBrainPasteBody:
      type: object
      required: [title, type, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: Preferred liability clause
        type:
          $ref: "#/components/schemas/OrganizationBrainItemType"
        content:
          type: string
          minLength: 1
          maxLength: 500000
          example: Liability is capped at fees paid in the previous 12 months.

    InvestigatorHistoryTurn:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        answer:
          type: string
          minLength: 1

    AskLegalKbBody:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          example: "ماذا تنص المادة 654 من قانون الموجبات والعقود؟"
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/InvestigatorHistoryTurn"

    LegalKbOfficialGazetteReference:
      type: object
      nullable: true
      properties:
        number:
          type: string
          nullable: true
        publishDate:
          type: string
          format: date
          nullable: true
        page:
          type: string
          nullable: true

    LegalKbInvestigatorSource:
      type: object
      description: >
        promulgatingAuthority (the Lebanese Republic) is the source's legal
        authority; compilerSource (e.g. the Lebanese University) is only the
        copy Clausio indexed, never the authority itself — kept as two
        distinct fields deliberately, never merged.
      properties:
        chunkId:
          type: string
          format: uuid
        excerpt:
          type: string
        sourceId:
          type: string
          format: uuid
        headingPath:
          type: string
          nullable: true
        instrumentTitle:
          type: string
          example: Code of Obligations and Contracts (قانون الموجبات والعقود)
        articleNumber:
          type: string
          nullable: true
          example: "654"
        officialGazetteReference:
          $ref: "#/components/schemas/LegalKbOfficialGazetteReference"
        amendingInstrument:
          type: string
          nullable: true
        amendmentEffectiveDate:
          type: string
          format: date
          nullable: true
        promulgatingAuthority:
          type: string
          example: Lebanese Republic
        compilerSource:
          type: string
          example: Lebanese University
        sourceUrl:
          type: string
          format: uri
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true

    AskLegalKbResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/LegalKbInvestigatorSource"
        confidence:
          type: number
          minimum: 0
          maximum: 100
        chunksRetrieved:
          type: integer
          example: 8

    AuditAction:
      type: string
      enum:
        - ORGANIZATION_CREATED
        - OWNER_ASSIGNED
        - ORGANIZATION_ACTIVATED
        - ORGANIZATION_SUSPENDED
        - ORGANIZATION_ARCHIVED
        - ORGANIZATION_SETTINGS_UPDATED
        - OWNERSHIP_TRANSFERRED
        - OWNERSHIP_RECOVERED
        - USER_INVITED
        - INVITATION_ACCEPTED
        - INVITATION_REVOKED
        - USER_SUSPENDED
        - USER_REACTIVATED
        - USER_DEACTIVATED
        - USER_ROLE_CHANGED
        - CONTRACT_UPLOADED
        - CONTRACT_TEXT_EXTRACTED
        - CONTRACT_METADATA_UPDATED
        - CONTRACT_BUSINESS_STATUS_CHANGED
        - CONTRACT_PROCESSING_STATUS_CHANGED
        - CONTRACT_SOFT_DELETED
        - NOTE_ADDED
        - NOTE_EDITED
        - NOTE_DELETED
        - WITNESS_INVITATION_CREATED
        - WITNESS_ACCESSED
        - WITNESS_INVITATION_REVOKED
        - AI_ANALYSIS_REQUESTED
        - AI_ANALYSIS_COMPLETED
        - AI_ANALYSIS_FAILED
        - ORGANIZATION_BRAIN_ITEM_CREATED
        - ORGANIZATION_BRAIN_ITEM_DELETED
        - PLATFORM_SUPPORT_ACCESS_GRANTED
        - PLATFORM_SUPPORT_ACCESS_REVOKED
      example: USER_ROLE_CHANGED

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a5b-8c9d-0e1f2a3b4c5d
        organizationId:
          type: string
          format: uuid
          example: 8b6b3f2e-1c1a-4a2b-9c3d-0f6a2e8b7a10
        actorType:
          type: string
          enum: [USER, PLATFORM_USER, SYSTEM]
          example: USER
        actorUserId:
          type: string
          format: uuid
          nullable: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        actorPlatformUserId:
          type: string
          format: uuid
          nullable: true
          example: null
        action:
          $ref: "#/components/schemas/AuditAction"
        targetEntityType:
          type: string
          example: User
        targetEntityId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        targetDisplayName:
          type: string
          nullable: true
          description: >
            Human-readable label for targetEntityType/targetEntityId,
            resolved server-side where a resolver is registered (e.g.
            User, Contract). Null when no resolver exists yet for that
            entity type or the target no longer exists.
          example: Marcus Chen
        contractId:
          type: string
          format: uuid
          nullable: true
          example: null
        witnessInvitationId:
          type: string
          format: uuid
          nullable: true
          example: null
        oldValue:
          type: object
          nullable: true
          additionalProperties: true
          example: { role: INTERNAL }
        newValue:
          type: object
          nullable: true
          additionalProperties: true
          example: { role: ADMIN }
        ipAddress:
          type: string
          nullable: true
          example: 203.0.113.42
        userAgent:
          type: string
          nullable: true
          example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)
        createdAt:
          type: string
          format: date-time
          example: "2024-01-16T09:05:00.000Z"

    AIAnalysis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9d8c7b6a-5f4e-4d3c-2b1a-0f9e8d7c6b5a
        contractId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type:
          type: string
          enum: [summary, risk, chat]
          example: risk
        prompt:
          type: string
          nullable: true
          description: User-supplied question, present for `chat` analyses.
          example: What happens if we terminate early?
        result:
          type: object
          additionalProperties: true
          description: Structured AI output; shape depends on `type`.
          example:
            riskScore: 62
            findings:
              - title: Auto-renewal clause
                severity: Medium
                explanation: Contract renews automatically unless cancelled 60 days prior.
        model:
          type: string
          nullable: true
          example: claude-sonnet-5
        requestedBy:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-17T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-17T12:00:00.000Z"

    WitnessToken:
      type: object
      description: >
        The raw `token` is only ever returned once, at creation time
        (`POST /users/witness-link`); only its hash is persisted.
      properties:
        id:
          type: string
          format: uuid
          example: 4b3a2c1d-6e5f-4a3b-9c8d-7e6f5a4b3c2d
        contractId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        token:
          type: string
          nullable: true
          description: Only present in the create-witness-link response.
          example: wv_8f3a1c2e9b4d4a6f8c1e2b3a4d5e6f7a
        witnessUrl:
          type: string
          nullable: true
          description: >
            The full link to hand to the witness (`{APP_URL}/witness/{token}`).
            Only present alongside `token`, i.e. only in the create-witness-link
            response — never reconstructable afterwards since the raw token
            isn't persisted.
          example: http://localhost:5173/witness/wv_8f3a1c2e9b4d4a6f8c1e2b3a4d5e6f7a
        witnessEmail:
          type: string
          format: email
          example: witness@example.com
        witnessName:
          type: string
          nullable: true
          example: Jordan Smith
        status:
          type: string
          description: Derived from `expiresAt` / `usedAt` / `revokedAt`.
          enum: [pending, used, expired, revoked]
          example: pending
        expiresAt:
          type: string
          format: date-time
          example: "2024-01-20T00:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-17T12:00:00.000Z"
        emailSentAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the invitation email was handed off to the mail queue —
            not confirmed delivered, since there's no delivery webhook.
            Null if `sendEmail` was false or no send was attempted.
          example: null

    WitnessLinkListItem:
      type: object
      description: >
        Shape returned by `GET /users/witness-link`. Never carries `token`/
        `witnessUrl` — those only exist in the create response, since the raw
        token is never persisted and can't be recovered for a listed row.
      properties:
        id:
          type: string
          format: uuid
          example: 4b3a2c1d-6e5f-4a3b-9c8d-7e6f5a4b3c2d
        contractId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        contractTitle:
          type: string
          example: Master Services Agreement
        witnessEmail:
          type: string
          format: email
          example: witness@example.com
        witnessName:
          type: string
          nullable: true
          example: Jordan Smith
        issuedBy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
              example: Alex Whitfield
        status:
          type: string
          description: Derived live from `isRevoked` / `status` / `expiresAt` — expiry is never swept back into the stored status column.
          enum: [pending, used, expired, revoked]
          example: pending
        expiresAt:
          type: string
          format: date-time
          example: "2024-01-20T00:00:00.000Z"
        usedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2024-01-17T12:00:00.000Z"
        emailSentAt:
          type: string
          format: date-time
          nullable: true
          example: null

    WitnessLinkStats:
      type: object
      description: >
        Real, org-scoped aggregate counts backing the Witness Workflow
        page's KPI cards and review-progress funnel. No historical
        snapshotting exists, so the `*NewLast7Days` fields are
        new-occurrence counts (created/used/newly-expired within the last 7
        days), not true before/after deltas. Uses the same isRevoked-before-
        status precedence as the `status` field elsewhere (e.g. a
        used-then-revoked invitation counts under `revoked`, not `used`).
      properties:
        total:
          type: integer
          description: All witness invitations ever created for the organization.
          example: 50
        totalNewLast7Days:
          type: integer
          example: 5
        active:
          type: integer
          description: Currently pending + used (not expired, not revoked).
          example: 39
        pending:
          type: integer
          example: 9
        used:
          type: integer
          example: 30
        usedThisMonth:
          type: integer
          description: Used, with usedAt within the current calendar month.
          example: 12
        usedLast7Days:
          type: integer
          example: 4
        expired:
          type: integer
          example: 8
        expiredNewLast7Days:
          type: integer
          example: 2
        revoked:
          type: integer
          example: 3

    WitnessScopedContract:
      type: object
      description: >
        The read-only contract view returned by `GET /witness/contract` (BR-8).
        Deliberately excludes organizationId, uploadedByUserId, notes, and AI
        analyses — a witness only ever sees the fields listed here.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Master Services Agreement
        counterparty:
          type: string
          example: Northwind Logistics Inc.
        businessStatus:
          type: string
        legalState:
          type: string
          nullable: true
        tags:
          type: array
          items: { type: string }
        effectiveDate:
          type: string
          format: date-time
          nullable: true
        expirationDate:
          type: string
          format: date-time
          nullable: true
        processingStatus:
          type: string
          enum:
            - PENDING_EXTRACTION
            - EXTRACTION_COMPLETED
            - EXTRACTION_FAILED
            - AI_PENDING
            - AI_COMPLETED
            - AI_FAILED
          description: >
            Only PENDING_EXTRACTION and EXTRACTION_FAILED are meaningful to
            the witness portal UI, which uses this to show a "still
            processing" or "failed" state instead of an empty document. The
            AI_* values reflect internal analysis progress, which is not
            witness-facing and should be treated the same as
            EXTRACTION_COMPLETED (show the document).
        processingError:
          type: string
          nullable: true
        extractedText:
          type: string
          nullable: true

# ─── Paths ─────────────────────────────────────────────────────────────────────
paths:
  /auth/accept-invitation:
    post:
      tags: [Auth]
      summary: Accept an invitation and activate a user account
      operationId: acceptInvitation
      description: >
        Clausio has no public self-registration (BR-3/BR-17) — organization
        membership is always granted through an Invitation. This endpoint
        validates a pending invitation token and creates the corresponding
        User account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationBody"
      responses:
        "201":
          description: Invitation accepted, user activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          description: Invalid, expired, or revoked invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation has already been used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets two HttpOnly cookies: `accessToken` (15 min) and
        `refreshToken` (7 days). Include `credentials: "include"` in fetch calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the `refreshToken` cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/witness/{token}:
    post:
      tags: [Auth]
      summary: Redeem a witness access link
      operationId: redeemWitnessToken
      description: >
        Validates a witness link token (issued via `POST /users/witness-link`)
        and, on success, sets an HttpOnly `witnessAccessToken` cookie scoped to
        the associated contract. Does not require a user account or `cookieAuth`.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          example: wv_8f3a1c2e9b4d4a6f8c1e2b3a4d5e6f7a
      responses:
        "200":
          description: Token accepted; witness session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: witnessAccessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contract:
                        $ref: "#/components/schemas/Contract"
                      witnessToken:
                        $ref: "#/components/schemas/WitnessToken"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Token expired or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/auth/login:
    post:
      tags: [Platform Auth]
      summary: Login as a platform user
      operationId: platformLogin
      description: >
        Authenticates a PlatformUser. Platform users are separate from
        organization Users and have no organizationId or organization role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginBody"
      responses:
        "200":
          description: Platform login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      platformUser:
                        $ref: "#/components/schemas/PlatformUser"
        "401":
          description: Invalid credentials or inactive platform account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /platform/auth/refresh:
    post:
      tags: [Platform Auth]
      summary: Refresh a platform session
      operationId: platformRefreshToken
      description: Reads the platform refreshToken cookie and issues new platform auth cookies.
      responses:
        "200":
          description: Platform tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid platform refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/auth/logout:
    post:
      tags: [Platform Auth]
      summary: Logout a platform user
      operationId: platformLogout
      security:
        - platformCookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/auth/me:
    get:
      tags: [Platform Auth]
      summary: Get the current platform user
      operationId: getPlatformProfile
      security:
        - platformCookieAuth: []
      responses:
        "200":
          description: Current platform user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/organizations:
    get:
      tags: [Platform Organizations]
      summary: List organizations for platform operators
      operationId: listPlatformOrganizations
      description: >
        Returns platform-level organization metadata and counts only. This
        endpoint does not expose contracts, file keys, extracted text, notes,
        analyses, organization private settings, or workspace content.
        Available to active PlatformUsers.
      security:
        - platformCookieAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: status
          in: query
          schema:
            type: string
            enum: [CREATED, OWNER_ASSIGNED, ACTIVE, SUSPENDED, ARCHIVED]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated organization directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformOrganization"
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          description: Not authenticated as a platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    post:
      tags: [Platform Organizations]
      summary: Create a new organization
      operationId: createPlatformOrganization
      description: >
        Requires PlatformUserRole SUPER_ADMIN. Creates an organization in
        CREATED status and creates its OrganizationSettings. The first Owner
        is assigned through POST /platform/organizations/{id}/owner.
      security:
        - platformCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlatformOrganizationBody"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformOrganization"
        "401":
          description: Not authenticated as a platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Platform user lacks SUPER_ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Organization slug is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /platform/organizations/{id}:
    get:
      tags: [Platform Organizations]
      summary: Get platform organization details
      operationId: getPlatformOrganization
      security:
        - platformCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Organization metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformOrganization"
        "401":
          description: Not authenticated as a platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/organizations/{id}/owner:
    post:
      tags: [Platform Organizations]
      summary: Assign the first organization Owner
      operationId: assignPlatformOrganizationOwner
      description: >
        Requires PlatformUserRole SUPER_ADMIN. Bootstraps the first OWNER user
        for a newly CREATED organization, then moves the organization to
        OWNER_ASSIGNED. This endpoint cannot assign additional owners and
        cannot be used after owner assignment.
      security:
        - platformCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPlatformOrganizationOwnerBody"
      responses:
        "200":
          description: First Owner assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformOrganization"
        "401":
          description: Not authenticated as a platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Platform user lacks SUPER_ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Owner already assigned, invalid lifecycle state, or email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /platform/organizations/{id}/status:
    patch:
      tags: [Platform Organizations]
      summary: Update organization lifecycle status
      operationId: updatePlatformOrganizationStatus
      description: >
        Requires PlatformUserRole SUPER_ADMIN. Supports activation,
        suspension, reactivation, and archival. ARCHIVED is terminal.
      security:
        - platformCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformOrganizationStatusBody"
      responses:
        "200":
          description: Organization status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlatformOrganization"
        "401":
          description: Not authenticated as a platform user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Platform user lacks SUPER_ADMIN role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /organization-brain:
    get:
      tags: [Organization Brain]
      summary: List organization brain items
      operationId: listOrganizationBrainItems
      description: >
        Lists templates, policies, preferred clauses, and internal guidelines
        owned by the authenticated user's organization. This endpoint performs
        metadata search only; Phase 4 does not perform embeddings, retrieval,
        reasoning, or AI calls.
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationBrainItemType"
        - name: search
          in: query
          description: Case-insensitive title search.
          schema:
            type: string
            maxLength: 200
          example: msa
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paginated list of organization brain items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationBrainListResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /organization-brain/upload:
    post:
      tags: [Organization Brain]
      summary: Upload an organization brain file
      operationId: uploadOrganizationBrainItem
      description: >
        Uploads a PDF, DOCX, or TXT file into the authenticated user's
        organization brain. Requires OWNER or ADMIN. Stored through the shared
        storage module; no AI processing is triggered.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, type, file]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: Preferred SaaS MSA
                type:
                  $ref: "#/components/schemas/OrganizationBrainItemType"
                file:
                  type: string
                  format: binary
                  description: PDF, DOCX, or TXT file up to 10 MB.
