  /legal-kb/ask:
    post:
      tags: [Legal Knowledge Base]
      summary: Ask a question against the Lebanese Legal Knowledge Base
      operationId: askLegalKb
      description: >
        Answers a question about Lebanese law using hybrid retrieval (vector
        + full-text + article-number-aware direct lookup) over a globally
        shared, platform-ingested corpus — not organization-scoped. Every
        citation is verified against retrieved chunk content, and every
        article number the answer mentions in prose is separately checked
        against the specific cited source's real article numbers before the
        answer is returned. Not organization-scoped, but the asking
        organization is still recorded for AI usage cost attribution.

        Engineering-complete does not mean cleared for real end users: per
        Phase 6's standing gate, this endpoint must not be shown to a real
        end user in production without a qualified legal reviewer engaged,
        independent of test coverage.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskLegalKbBody"
      responses:
        "200":
          description: Citation-verified answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AskLegalKbResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The Legal Knowledge Base has no indexed content yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "502":
          description: Could not produce a verifiable, citation- and article-existence-checked answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Legal Knowledge Base search is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

