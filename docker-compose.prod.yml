networks:
  clausio_internal:
    name: clausio_internal

services:
  postgres:
    # Must match dev's docker-compose.yml image, not vanilla postgres: three
    # migrations (add_contract_chunks_investigator, add_organization_brain_chunks,
    # add_legal_kb) run `CREATE EXTENSION IF NOT EXISTS "vector"` and use
    # vector(1536) columns — the extension isn't present in postgres:16-alpine.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No shared_buffers/max_connections override: that used to tune both
    # *below* Postgres's own compiled-in defaults (128MB/100) specifically
    # for a 1 GB VPS. The real VPS (6 vCPU/12 GB) doesn't need that — see
    # the Deployment Review Log in docs/Clausio_Deployment_Architecture.md.
    volumes:
      - ${CLAUSIO_DATA_DIR:-/opt/clausio/data}/postgres:/var/lib/postgresql/data
    networks:
      - clausio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${CLAUSIO_DATA_DIR:-/opt/clausio/data}/redis:/data
    networks:
      - clausio_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    # Pinned to the exact release this project's dev environment actually
    # runs (verified via `docker exec ... minio --version`), not an
    # arbitrary "latest stable" pick — this is the version the application
    # has genuinely been developed and tested against.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${CLAUSIO_DATA_DIR:-/opt/clausio/data}/minio:/data
    networks:
      - clausio_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    # Pinned to the mc release this project's dev environment actually
    # runs, matching the minio pin above for the same reason.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks:
      - clausio_internal
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET};
      "

  api:
    image: ghcr.io/onrampl1/clausio-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - clausio_internal
    deploy:
      resources:
        limits:
          memory: 512M

  workers:
    image: ghcr.io/onrampl1/clausio-workers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - clausio_internal
    deploy:
      resources:
        limits:
          memory: 1.5G

  web:
    image: ghcr.io/onrampl1/clausio-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - clausio_internal
    deploy:
      resources:
        limits:
          memory: 128M
