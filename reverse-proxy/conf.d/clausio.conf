server {
    listen 80;
    server_name clausio.wahabtlais.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name clausio.wahabtlais.site;

    ssl_certificate     /etc/letsencrypt/live/clausio.wahabtlais.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clausio.wahabtlais.site/privkey.pem; 

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Matches the API's own 25MB contract-upload limit — nginx's 1MB
    # default would otherwise reject uploads with a 413 before they ever
    # reach the api container.
    client_max_body_size 25m;

    location /api {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}