map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name clausio.wahabtlais.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Plain HTTP on purpose — lets the compose healthcheck (and anything
    # else) confirm nginx is alive even before a real certificate exists,
    # during the bootstrap window described in reverse-proxy/DEPLOYMENT.md.
    location = /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name clausio.wahabtlais.site;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/clausio.wahabtlais.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clausio.wahabtlais.site/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Matches the API's own 25MB contract-upload limit — nginx's 1MB
    # default would otherwise reject uploads with a 413 before they ever
    # reach the api container.
    client_max_body_size 25m;

    # HTTP/1.1 upstream connections, not the 1.0 nginx defaults to for
    # proxy_pass — required for keepalive to api/web and for the
    # Upgrade/Connection pair below to do anything at all. Inherited by
    # both locations below (a scalar directive, unlike proxy_set_header).
    proxy_http_version 1.1;

    # Sized for this app's actual traffic, not nginx's small generic
    # defaults — large contract uploads need the read timeout headroom,
    # and the AI-analysis phase's chat/query endpoint will need it too.
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location /api {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Harmless when nothing asks to upgrade (falls back to a normal
        # proxied connection via the $connection_upgrade map above);
        # becomes real WebSocket support the moment anything needs it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
